<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 130">
  <style>
    text { font-family: 'IBM Plex Sans Condensed', monospace; letter-spacing: 0.07em; }
    .sh { fill: #d7ac61; font-size: 9px; }
    .si { fill: #e8e1d2; font-size: 9px; opacity: 0.65; }
    .sb { fill: none; stroke: #d7ac61; stroke-width: 0.75; opacity: 0.5; }
    .al { stroke: #d7ac61; stroke-width: 0.75; opacity: 0.6; }
    .dv { stroke: #d7ac61; stroke-width: 0.5; opacity: 0.3; }
  </style>

  <!-- Box 1: NEW LEAD -->
  <rect class="sb" x="20" y="20" width="120" height="90"/>
  <text class="sh" x="34" y="42">NEW LEAD</text>
  <line class="dv" x1="34" y1="50" x2="126" y2="50"/>
  <text class="si" x="34" y="68">new_lead</text>
  <text class="si" x="34" y="84">inquiry submitted</text>

  <line class="al" x1="142" y1="65" x2="168" y2="65"/>
  <polygon points="168,61 178,65 168,69" fill="#d7ac61" opacity="0.6"/>

  <!-- Box 2: INTAKE -->
  <rect class="sb" x="180" y="20" width="120" height="90"/>
  <text class="sh" x="194" y="42">INTAKE</text>
  <line class="dv" x1="194" y1="50" x2="286" y2="50"/>
  <text class="si" x="194" y="68">intake_pending</text>
  <text class="si" x="194" y="84">intake email sent</text>

  <line class="al" x1="302" y1="65" x2="328" y2="65"/>
  <polygon points="328,61 338,65 328,69" fill="#d7ac61" opacity="0.6"/>

  <!-- Box 3: FIT REVIEW -->
  <rect class="sb" x="340" y="20" width="120" height="90"/>
  <text class="sh" x="354" y="42">FIT REVIEW</text>
  <line class="dv" x1="354" y1="50" x2="446" y2="50"/>
  <text class="si" x="354" y="68">fit_review</text>
  <text class="si" x="354" y="84">draft approval</text>

  <line class="al" x1="462" y1="65" x2="488" y2="65"/>
  <polygon points="488,61 498,65 488,69" fill="#d7ac61" opacity="0.6"/>

  <!-- Box 4: FIT OK -->
  <rect class="sb" x="500" y="20" width="120" height="90"/>
  <text class="sh" x="514" y="42">FIT OK</text>
  <line class="dv" x1="514" y1="50" x2="606" y2="50"/>
  <text class="si" x="514" y="68">fit_confirmed</text>
  <text class="si" x="514" y="84">slots proposed</text>

  <line class="al" x1="622" y1="65" x2="648" y2="65"/>
  <polygon points="648,61 658,65 648,69" fill="#d7ac61" opacity="0.6"/>

  <!-- Box 5: AWAITING -->
  <rect class="sb" x="660" y="20" width="120" height="90"/>
  <text class="sh" x="674" y="42">AWAITING</text>
  <line class="dv" x1="674" y1="50" x2="766" y2="50"/>
  <text class="si" x="674" y="68">client_confirm</text>
  <text class="si" x="674" y="84">slot selected</text>

  <line class="al" x1="782" y1="65" x2="808" y2="65"/>
  <polygon points="808,61 818,65 808,69" fill="#d7ac61" opacity="0.6"/>

  <!-- Box 6: BOOKED -->
  <rect class="sb" x="820" y="20" width="120" height="90"/>
  <text class="sh" x="834" y="42">BOOKED</text>
  <line class="dv" x1="834" y1="50" x2="926" y2="50"/>
  <text class="si" x="834" y="68">booked</text>
  <text class="si" x="834" y="84">booking confirmed</text>
</svg>
