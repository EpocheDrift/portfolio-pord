  <text class="lh" x="14" y="36">PASSIVE CAPTURE</text>
  <line x1="14" y1="44" x2="197" y2="44" stroke="#d7ac61" stroke-width="0.5" opacity="0.3"/>
  <text class="li" x="14" y="64">· Screenshots</text>
  <text class="li" x="14" y="82">· Wearable Camera</text>
  <text class="li" x="14" y="100">· Ambient Audio</text>
  <line class="al" x1="212" y1="96" x2="270" y2="96"/>
  <polygon points="270,92 280,96 270,100" fill="#d7ac61" opacity="0.6"/>
  <rect class="lb" x="281" y="1" width="178" height="190"/>
